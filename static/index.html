<!DOCTYPE html>
<html>
<head>
    <title>AI Teaching Assistant</title>
    <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #2c3e50; }
    input { width: 70%; padding: 10px; font-size: 16px; }
    button { padding: 10px 24px; font-size: 16px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 4px; }
    #answer { margin-top: 24px; padding: 16px; background: #f6f8fa; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; }
    #sources { margin-top: 8px; color: #666; font-size: 14px; }
</style>
</head>
<body>
    <h1>AI Teaching Assistant</h1>
    <p>Ask a question about the course materials.</p>

    <input type="text" id="question" placeholder="e.g. what is a while loop?" size="50">
    <button id="askBtn">Ask</button>

    <div id="answer"></div>
    <div id="sources"></div>



    <script>


    document.getElementById("askBtn").addEventListener("click", async() => {

        const question = document.getElementById("question").value;
        document.getElementById("answer").innerText = "Thinking...";
        document.getElementById("sources").innerText = "";

        const res = await fetch( "/ask",  {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({question: question})
        });

        const data = await res.json();
        document.getElementById("answer").innerText = data.answer || data.detail;
        document.getElementById("sources").innerText =
        data.sources?.length ? "Sources: " + data.sources.map(s => s.doc + " / " + s.heading).join(", ") : "";


    });

    </script>



</body>
</html>
